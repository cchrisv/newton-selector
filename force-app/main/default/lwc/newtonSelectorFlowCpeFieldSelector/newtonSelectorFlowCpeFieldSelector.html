<template>
  <c-newton-selector-combobox
    mode="lookup"
    label={label}
    placeholder="Search fields..."
    selection={selection}
    required={required}
    min-search-term-length="0"
    scroll-after-n-items="7"
    onsearch={handleSearch}
    onselectionchange={handleSelectionChange}
  ></c-newton-selector-combobox>
  <template lwc:if={loadError}>
    <p class="slds-form-element__help slds-text-color_error" role="alert">
      {loadError}
    </p>
  </template>
</template>
