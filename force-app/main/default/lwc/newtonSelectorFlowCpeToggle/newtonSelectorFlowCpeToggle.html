<template>
  <div class={rootClass}>
    <div class="slds-form-element">
      <template lwc:if={hasVisibleLabel}>
        <div class="newton-selector-flow-cpe-toggle__label-row">
          <span
            class="slds-form-element__label newton-selector-flow-cpe-toggle__label"
            >{label}</span
          >
        </div>
      </template>
      <div class="slds-form-element__control">
        <div
          class="newton-selector-flow-cpe-toggle__control"
          role="radiogroup"
          aria-label={label}
          onkeydown={handleKeydown}
        >
          <button
            type="button"
            class={inactiveOptionClass}
            data-checked="false"
            role="radio"
            aria-checked={inactiveAriaChecked}
            tabindex={inactiveTabIndex}
            onclick={handleChoiceClick}
          >
            {inactiveLabel}
          </button>
          <button
            type="button"
            class={activeOptionClass}
            data-checked="true"
            role="radio"
            aria-checked={activeAriaChecked}
            tabindex={activeTabIndex}
            onclick={handleChoiceClick}
          >
            {activeLabel}
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
