<template>
  <section class="newton-chapter" data-chapter="behavior">
    <header class="newton-chapter__head">
      <p class="newton-chapter__eyebrow">Behavior</p>
      <h2 class="newton-chapter__title">How users interact</h2>
    </header>
  </section>
  <template lwc:if={hasDataSource}>
    <!-- CARD · Mode -->
    <article class="slds-card newton-studio__card">
      <header
        class="slds-card__header newton-card__head newton-card__head_with-action"
      >
        <span class="newton-card__glyph" aria-hidden="true">
          <c-newton-selector-icon
            name="check"
            size="small"
            alternative-text=""
          ></c-newton-selector-icon>
        </span>
        <div class="newton-card__headings">
          <h3 class="slds-card__header-title slds-text-heading_small">Mode</h3>
          <p
            class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
          >
            Choose whether users pick one option or several.
          </p>
        </div>
        <span class="newton-card__action">
          <c-newton-selector-flow-cpe-toggle
            label="Selection mode"
            variant="label-hidden"
            active-label="Multi"
            inactive-label="Single"
            checked={isMultiSelect}
            ontoggle={handleSelectionModeToggle}
          ></c-newton-selector-flow-cpe-toggle>
        </span>
      </header>
      <div
        class="slds-card__body slds-card__body_inner newton-studio__field-block"
      >
        <c-newton-selector-flow-cpe-resource-selector
          name="defaultSelection"
          label="Default selection"
          value={defaultSelectionRef}
          builder-context={builderContext}
          automatic-output-variables={automaticOutputVariables}
          builder-context-filter-type="String"
          builder-context-filter-collection-boolean={isMultiSelect}
          onvaluechanged={handleDefaultSelectionChange}
        ></c-newton-selector-flow-cpe-resource-selector>
        <template lwc:if={isMultiSelect}>
          <div class="newton-studio__field-grid">
            <lightning-input
              type="number"
              label="Minimum selections"
              value={minSelectionsValue}
              min="0"
              placeholder="None"
              onchange={handleMinChange}
            ></lightning-input>
            <lightning-input
              type="number"
              label="Maximum selections"
              value={maxSelectionsValue}
              min="1"
              placeholder="No maximum"
              onchange={handleMaxChange}
            ></lightning-input>
          </div>
        </template>
      </div>
    </article>

    <!-- CARD · Required -->
    <article class="slds-card newton-studio__card">
      <header
        class="slds-card__header newton-card__head newton-card__head_with-action"
      >
        <span class="newton-card__glyph" aria-hidden="true">
          <c-newton-selector-icon
            name="asterisk"
            size="small"
            alternative-text=""
          ></c-newton-selector-icon>
        </span>
        <div class="newton-card__headings">
          <h3 class="slds-card__header-title slds-text-heading_small">
            Required
          </h3>
          <p
            class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
          >
            Require a selection before users continue.
          </p>
        </div>
        <span class="newton-card__action">
          <c-newton-selector-flow-cpe-toggle
            label="Required"
            variant="label-hidden"
            active-label="Required"
            inactive-label="Optional"
            checked={_config.required}
            data-key="required"
            ontoggle={handleToggleChange}
          ></c-newton-selector-flow-cpe-toggle>
        </span>
        <lightning-helptext
          class="newton-card__help"
          content="Users can't continue until they pick an option. An error message, if you set one, replaces every message this selector shows, including the minimum and maximum selection messages."
        ></lightning-helptext>
      </header>
      <template lwc:if={_config.required}>
        <div
          class="slds-card__body slds-card__body_inner newton-studio__field-block"
        >
          <c-newton-selector-flow-cpe-resource-selector
            name="customErrorMessage"
            label="Error message (optional)"
            value={_config.customErrorMessage}
            builder-context={builderContext}
            automatic-output-variables={automaticOutputVariables}
            builder-context-filter-type="String"
            allow-hard-code-reference
            onvaluechanged={handleErrorMessageChange}
          ></c-newton-selector-flow-cpe-resource-selector>
        </div>
      </template>
    </article>

    <!-- CARD · Auto-advance -->
    <template lwc:if={isSingleSelect}>
      <article class="slds-card newton-studio__card">
        <header
          class="slds-card__header newton-card__head newton-card__head_with-action"
        >
          <span class="newton-card__glyph" aria-hidden="true">
            <c-newton-selector-icon
              name="navigation"
              size="small"
              alternative-text=""
            ></c-newton-selector-icon>
          </span>
          <div class="newton-card__headings">
            <h3 class="slds-card__header-title slds-text-heading_small">
              Auto-advance
            </h3>
            <p
              class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
            >
              Go to the next screen as soon as a user picks an option.
            </p>
          </div>
          <span class="newton-card__action">
            <c-newton-selector-flow-cpe-toggle
              label="Auto-advance"
              variant="label-hidden"
              active-label="On"
              inactive-label="Off"
              checked={_config.autoAdvance}
              data-key="autoAdvance"
              ontoggle={handleToggleChange}
            ></c-newton-selector-flow-cpe-toggle>
          </span>
        </header>
      </article>
    </template>

    <!-- CARD · None option -->
    <article class="slds-card newton-studio__card">
      <header
        class="slds-card__header newton-card__head newton-card__head_with-action"
      >
        <span class="newton-card__glyph" aria-hidden="true">
          <c-newton-selector-icon
            name="circle-x"
            size="small"
            alternative-text=""
          ></c-newton-selector-icon>
        </span>
        <div class="newton-card__headings">
          <h3 class="slds-card__header-title slds-text-heading_small">
            None option
          </h3>
          <p
            class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
          >
            Add an empty choice so users can clear their selection.
          </p>
        </div>
        <span class="newton-card__action">
          <c-newton-selector-flow-cpe-toggle
            label="Include a --None-- option"
            variant="label-hidden"
            active-label="On"
            inactive-label="Off"
            checked={_config.includeNoneOption}
            data-key="includeNoneOption"
            ontoggle={handleToggleChange}
          ></c-newton-selector-flow-cpe-toggle>
        </span>
      </header>
      <template lwc:if={_config.includeNoneOption}>
        <div
          class="slds-card__body slds-card__body_inner newton-studio__field-block"
        >
          <lightning-input
            type="text"
            label="None option label"
            value={_config.noneOptionLabel}
            placeholder="--None--"
            onchange={handleNoneOptionLabelChange}
          ></lightning-input>
          <div class="newton-studio__field" aria-label="None option position">
            <p class="newton-studio__field-label">Position</p>
            <div
              class="newton-studio__selectorgroup"
              role="radiogroup"
              aria-label="None option position"
              oncardselect={handleNoneOptionPositionChange}
            >
              <template for:each={noneOptionPositionTiles} for:item="tile">
                <c-newton-selector-choice-tile
                  key={tile.value}
                  item={tile}
                  selected={tile._selected}
                  selection-mode="single"
                  group-name="newton-none-pos"
                  size="small"
                  framed-visual
                  aspect-ratio="3:2"
                ></c-newton-selector-choice-tile>
              </template>
            </div>
          </div>
        </div>
      </template>
    </article>

    <!-- CARD · Manual input -->
    <article class="slds-card newton-studio__card">
      <header
        class="slds-card__header newton-card__head newton-card__head_with-action"
      >
        <span class="newton-card__glyph" aria-hidden="true">
          <c-newton-selector-icon
            name="square-pen"
            size="small"
            alternative-text=""
          ></c-newton-selector-icon>
        </span>
        <div class="newton-card__headings">
          <h3 class="slds-card__header-title slds-text-heading_small">
            Manual input
          </h3>
          <p
            class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
          >
            Let users enter free text as an additional choice.
          </p>
        </div>
        <span class="newton-card__action">
          <c-newton-selector-flow-cpe-toggle
            label="Allow manual input"
            variant="label-hidden"
            active-label="On"
            inactive-label="Off"
            checked={_config.manualInput.enabled}
            ontoggle={handleManualInputToggle}
          ></c-newton-selector-flow-cpe-toggle>
        </span>
        <lightning-helptext
          class="newton-card__help"
          content="Adds an option users can type into, such as Other. The flow receives the typed text as the selector's value."
        ></lightning-helptext>
      </header>
      <template lwc:if={_config.manualInput.enabled}>
        <div
          class="slds-card__body slds-card__body_inner newton-studio__field-block"
        >
          <lightning-input
            type="text"
            label="Manual option label"
            value={_config.manualInput.label}
            placeholder="Other"
            onchange={handleManualInputLabelChange}
          ></lightning-input>
          <div class="newton-studio__field-grid">
            <lightning-input
              type="number"
              label="Minimum characters"
              value={_config.manualInput.minLength}
              min="0"
              onchange={handleManualInputMinLengthChange}
            ></lightning-input>
            <lightning-input
              type="number"
              label="Maximum characters"
              placeholder="Unlimited"
              value={_config.manualInput.maxLength}
              min="1"
              onchange={handleManualInputMaxLengthChange}
            ></lightning-input>
          </div>
        </div>
      </template>
    </article>

    <!-- CARD · Search -->
    <article class="slds-card newton-studio__card">
      <header
        class="slds-card__header newton-card__head newton-card__head_with-action"
      >
        <span class="newton-card__glyph" aria-hidden="true">
          <c-newton-selector-icon
            name="search"
            size="small"
            alternative-text=""
          ></c-newton-selector-icon>
        </span>
        <div class="newton-card__headings">
          <h3 class="slds-card__header-title slds-text-heading_small">
            Search
          </h3>
          <p
            class="slds-card__header-subtitle slds-text-body_small slds-text-color_weak"
          >
            Let users filter options before selecting.
          </p>
        </div>
        <span class="newton-card__action">
          <c-newton-selector-flow-cpe-toggle
            label="Show a search filter"
            variant="label-hidden"
            active-label="On"
            inactive-label="Off"
            checked={_config.enableSearch}
            data-key="enableSearch"
            ontoggle={handleToggleChange}
          ></c-newton-selector-flow-cpe-toggle>
        </span>
        <lightning-helptext
          class="newton-card__help"
          content="Search sits above the tiles, inside the Dropdown list, or above each Dual listbox list."
        ></lightning-helptext>
      </header>
    </article>
  </template>
  <template lwc:else>
    <p class="slds-text-body_regular slds-text-color_weak">
      Choose a data source in Data first. Behavior settings appear here then.
    </p>
  </template>
</template>
