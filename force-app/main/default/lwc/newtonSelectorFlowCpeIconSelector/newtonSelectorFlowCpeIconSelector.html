<template>
  <div class={selectorClass}>
    <label class="slds-form-element__label" for="combobox-trigger"
      >{label}</label
    >
    <div class="slds-form-element__control">
      <c-newton-selector-combobox
        class="newton-combobox"
        open={_isOpen}
        dropdown-role="dialog"
        dropdown-label="Icon selector"
        dropdown-class="newton-combobox__panel"
        onfocusout={handleFocusOut}
      >
        <div slot="trigger" class="newton-combobox__field">
          <button
            lwc:ref="trigger"
            type="button"
            class="slds-input newton-combobox__trigger"
            id="combobox-trigger"
            aria-haspopup="dialog"
            aria-expanded={_isOpen}
            onclick={handleOpen}
          >
            <template lwc:if={hasSelection}>
              <span class="newton-combobox__preview" aria-hidden="true">
                <c-newton-selector-icon
                  name={_value}
                  size="small"
                  box="tile"
                  alternative-text=""
                ></c-newton-selector-icon>
              </span>
            </template>
            <span class="newton-combobox__label">{placeholderLabel}</span>
            <template lwc:if={hasSelection}>
              <span
                class="newton-combobox__clear-space"
                aria-hidden="true"
              ></span>
            </template>
            <c-newton-selector-icon
              name="chevron-down"
              size="x-small"
              box="button"
              alternative-text=""
            ></c-newton-selector-icon>
          </button>
          <template lwc:if={hasSelection}>
            <button
              type="button"
              class="newton-combobox__clear"
              aria-label="Clear icon"
              onclick={handleClear}
            >
              <c-newton-selector-icon
                name="x"
                size="xx-small"
                box="button"
                alternative-text=""
              ></c-newton-selector-icon>
            </button>
          </template>
        </div>

        <template lwc:if={_isOpen}>
          <div
            slot="dropdown"
            class="newton-combobox__panel-content"
            tabindex="-1"
          >
            <div
              class="newton-search slds-form-element__control slds-input-has-icon slds-input-has-icon_left"
            >
              <span
                class="slds-icon_container slds-input__icon slds-input__icon_left"
                aria-hidden="true"
              >
                <c-newton-selector-icon
                  name="search"
                  size="x-small"
                  box="input"
                  alternative-text=""
                ></c-newton-selector-icon>
              </span>
              <input
                type="search"
                class="slds-input newton-search__input"
                placeholder="Search icons..."
                value={_searchTerm}
                oninput={handleSearchInput}
                aria-label="Search icons"
              />
            </div>

            <template lwc:if={hasVisibleIcons}>
              <div class="newton-grid" role="listbox" aria-label="Icons">
                <template for:each={visibleIcons} for:item="entry">
                  <button
                    key={entry.id}
                    type="button"
                    class={entry.buttonClass}
                    role="option"
                    aria-selected={entry.selected}
                    aria-label={entry.assistiveLabel}
                    title={entry.iconName}
                    data-icon={entry.iconName}
                    onclick={handleIconClick}
                  >
                    <c-newton-selector-icon
                      name={entry.iconName}
                      size="medium"
                      box="tile"
                      alternative-text=""
                    ></c-newton-selector-icon>
                    <span class="newton-selector-icon-cell__label"
                      >{entry.displayLabel}</span
                    >
                  </button>
                </template>
              </div>
              <div class="newton-selector-icon-selector__more" role="status">
                <span>{resultCountLabel}</span>
                <template lwc:if={hasMoreIcons}>
                  <lightning-button
                    variant="neutral"
                    label={showMoreLabel}
                    onclick={handleShowMore}
                  ></lightning-button>
                </template>
              </div>
            </template>
            <template lwc:else>
              <div class="newton-selector-icon-selector__empty" role="status">
                No icons match this search.
              </div>
            </template>
          </div>
        </template>
      </c-newton-selector-combobox>
    </div>
  </div>
</template>
