<template>
  <template lwc:if={isLookupMode}>
    <div class="slds-form-element">
      <label class={labelClass} for={inputId}>
        <abbr lwc:if={required} class="slds-required" title="required">*</abbr>
        {label}
      </label>
      <div class="slds-form-element__control">
        <div class="slds-combobox_container">
          <div class={lookupComboboxClass} onfocusout={handleLookupFocusOut}>
            <div class={inputContainerClass} role="none">
              <template lwc:if={selectedIconName}>
                <span
                  class="slds-icon_container slds-combobox__input-entity-icon newton-selector-combobox__input-entity-icon"
                >
                  <c-newton-selector-icon
                    name={selectedIconName}
                    size="x-small"
                    box="input"
                    alternative-text="Selected item icon"
                  ></c-newton-selector-icon>
                </span>
              </template>

              <input
                lwc:ref="searchinput"
                type="text"
                id={inputId}
                class={inputClass}
                placeholder={placeholder}
                value={inputDisplayValue}
                readonly={hasSelection}
                autocomplete="off"
                role="combobox"
                aria-autocomplete="list"
                aria-haspopup="listbox"
                aria-expanded={comboboxExpanded}
                aria-controls={_listboxId}
                aria-activedescendant={listboxActiveOptionId}
                aria-required={requiredAria}
                oninput={handleNativeInput}
                onkeydown={handleKeydown}
                onfocus={handleFocus}
              />

              <template lwc:if={showSearchIcon}>
                <span
                  class="slds-icon_container slds-input__icon slds-input__icon_right"
                >
                  <c-newton-selector-icon
                    name="search"
                    size="x-small"
                    box="input"
                    alternative-text="Search"
                  ></c-newton-selector-icon>
                </span>
              </template>

              <template lwc:if={hasSelection}>
                <button
                  title="Remove selected option"
                  type="button"
                  onclick={handleClearSelection}
                  class="slds-button slds-button_icon slds-input__icon slds-input__icon_right newton-selector-combobox__clear-button"
                >
                  <c-newton-selector-icon
                    name="x"
                    size="x-small"
                    box="button"
                    alternative-text="Remove selected option"
                    class="newton-selector-combobox__clear-icon"
                  ></c-newton-selector-icon>
                </button>
              </template>
            </div>

            <template lwc:if={_dropdownOpen}>
              <div
                id={_listboxId}
                role="listbox"
                aria-label={label}
                aria-busy={ariaBusyValue}
                class="slds-dropdown slds-dropdown_fluid newton-selector-combobox__dropdown newton-selector-combobox__lookup-dropdown"
              >
                <ul
                  class="slds-listbox slds-listbox_vertical newton-selector-combobox__listbox"
                  role="presentation"
                >
                  <template lwc:if={_loading}>
                    <li role="presentation">
                      <div
                        class="slds-p-around_medium newton-selector-combobox__state"
                      >
                        <lightning-spinner
                          alternative-text="Loading"
                          size="small"
                        ></lightning-spinner>
                      </div>
                    </li>
                  </template>
                  <template lwc:elseif={displayedOptions.length}>
                    <template for:each={displayedOptions} for:item="row">
                      <li
                        key={row.key}
                        role="presentation"
                        class="slds-listbox__item newton-selector-combobox__item"
                      >
                        <div
                          class="slds-media slds-listbox__option slds-listbox__option_entity slds-media_small newton-selector-combobox__option"
                          role="option"
                          id={row.optionId}
                          data-id={row.id}
                          data-index={row.index}
                          aria-selected={row.ariaSelected}
                          onclick={handleSelect}
                          onmousedown={handlePointerDownOption}
                        >
                          <c-newton-selector-flow-cpe-lookup-choice-option
                            row={row}
                            search-term={row.searchTerm}
                            selected={row.isActive}
                          ></c-newton-selector-flow-cpe-lookup-choice-option>
                        </div>
                      </li>
                    </template>
                  </template>
                  <template lwc:else>
                    <li role="presentation">
                      <div
                        class="slds-p-around_small slds-text-color_weak newton-selector-combobox__state"
                      >
                        {noResultsMessage}
                      </div>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template lwc:elseif={isSelectMode}>
    <div class="slds-form-element">
      <label class={labelClass} for={inputId}>
        <abbr lwc:if={required} class="slds-required" title="required">*</abbr>
        {label}
      </label>
      <div class="slds-form-element__control">
        <div class="slds-combobox_container">
          <div class={selectComboboxClass} onfocusout={handleSelectFocusOut}>
            <div class={selectInputContainerClass} role="none">
              <template lwc:if={selectedSelectIconName}>
                <span
                  class="slds-icon_container slds-combobox__input-entity-icon newton-selector-combobox__input-entity-icon"
                >
                  <c-newton-selector-icon
                    name={selectedSelectIconName}
                    size="x-small"
                    box="input"
                    alternative-text=""
                  ></c-newton-selector-icon>
                </span>
              </template>

              <button
                lwc:ref="selectButton"
                id={inputId}
                type="button"
                class={selectButtonClass}
                role="combobox"
                aria-haspopup="listbox"
                aria-controls={_listboxId}
                aria-expanded={selectExpanded}
                aria-activedescendant={selectActiveOptionId}
                aria-required={requiredAria}
                title={selectButtonLabel}
                onclick={handleSelectToggle}
                onkeydown={handleSelectKeydown}
              >
                <span class="slds-truncate">{selectButtonLabel}</span>
              </button>

              <span
                class="slds-icon_container slds-input__icon slds-input__icon_right"
                aria-hidden="true"
              >
                <c-newton-selector-icon
                  name={selectChevron}
                  size="x-small"
                  box="input"
                  alternative-text=""
                ></c-newton-selector-icon>
              </span>
            </div>

            <template lwc:if={_selectOpen}>
              <div
                class="slds-dropdown slds-dropdown_fluid newton-selector-combobox__dropdown newton-selector-combobox__select-dropdown"
              >
                <template lwc:if={enableSearch}>
                  <div class="newton-selector-combobox__select-search">
                    <div
                      class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left"
                    >
                      <span
                        class="slds-icon_container slds-input__icon slds-input__icon_left"
                        aria-hidden="true"
                      >
                        <c-newton-selector-icon
                          name="search"
                          size="x-small"
                          box="input"
                          alternative-text=""
                        ></c-newton-selector-icon>
                      </span>
                      <input
                        type="search"
                        class="slds-input"
                        placeholder={placeholder}
                        value={_selectSearchTerm}
                        aria-label="Filter options"
                        aria-controls={_listboxId}
                        aria-activedescendant={selectActiveOptionId}
                        oninput={handleSelectSearch}
                        onkeydown={handleSelectKeydown}
                      />
                    </div>
                  </div>
                </template>

                <ul
                  id={_listboxId}
                  role="listbox"
                  aria-label={label}
                  class="slds-listbox slds-listbox_vertical newton-selector-combobox__listbox"
                >
                  <template lwc:if={hasSelectOptions}>
                    <template for:each={filteredSelectOptions} for:item="row">
                      <li
                        key={row.key}
                        role="presentation"
                        class="slds-listbox__item newton-selector-combobox__item"
                      >
                        <div
                          class={row.optionClass}
                          role="option"
                          id={row.optionId}
                          data-value={row.id}
                          data-index={row.index}
                          aria-selected={row.ariaSelected}
                          onclick={handleSelectOption}
                          onmousedown={handleSelectOptionMouseDown}
                        >
                          <c-newton-selector-flow-cpe-lookup-choice-option
                            row={row}
                            search-term={row.searchTerm}
                            selected={row.isSelected}
                          ></c-newton-selector-flow-cpe-lookup-choice-option>
                        </div>
                      </li>
                    </template>
                  </template>
                  <template lwc:else>
                    <li role="presentation">
                      <div
                        class="slds-p-around_small slds-text-color_weak newton-selector-combobox__state"
                      >
                        {noResultsMessage}
                      </div>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template lwc:else>
    <div class="slds-combobox_container">
      <div class={computedComboboxClass}>
        <slot name="trigger"></slot>

        <template lwc:if={open}>
          <div
            class="slds-dropdown slds-dropdown_fluid newton-selector-combobox__dropdown"
            role={dropdownRole}
            aria-label={dropdownLabel}
          >
            <slot name="dropdown"></slot>
          </div>
        </template>
      </div>
    </div>
  </template>
</template>
