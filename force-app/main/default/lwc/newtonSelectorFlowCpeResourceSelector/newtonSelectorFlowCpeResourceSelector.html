<template>
  <div style={inputStyle}>
    <div class={formElementClass}>
      <div class="slds-form-element__control">
        <c-newton-selector-combobox
          open={isMenuOpen}
          dropdown-role="presentation"
        >
          <div slot="trigger" data-id="resultBox">
            <div class="slds-form-element__control" role="none">
              <template lwc:if={displayPill}>
                <label
                  id="resource-label"
                  class={labelClassForPill}
                  onclick={toggleMenu}
                  ><abbr
                    lwc:if={required}
                    class="slds-required"
                    title="required"
                    >*</abbr
                  >{label}</label
                >
                <button
                  type="button"
                  role="combobox"
                  aria-haspopup="listbox"
                  aria-expanded={dropdownExpanded}
                  aria-controls={listboxId}
                  aria-activedescendant={activeOptionId}
                  aria-labelledby="resource-label resource-value"
                  aria-describedby={errorDescribedBy}
                  aria-invalid={ariaInvalid}
                  class="slds-input slds-input_faux slds-combobox__input slds-combobox__input-value newton-selector-flow-cpe-resource-selector__selected-trigger"
                  title={selectedDisplayLabel}
                  onclick={handleOpenOptions}
                  onkeydown={handleKeyDown}
                >
                  <span
                    class="newton-selector-flow-cpe-resource-selector__selected-icon"
                    aria-hidden="true"
                  >
                    <c-newton-selector-icon
                      name={selectedResourceIconName}
                      size="small"
                      box="tile"
                      alternative-text=""
                    ></c-newton-selector-icon>
                  </span>
                  <span
                    id="resource-value"
                    class="newton-selector-flow-cpe-resource-selector__selected-label"
                    >{selectedDisplayLabel}</span
                  >
                  <c-newton-selector-icon
                    name="chevron-down"
                    size="x-small"
                    box="button"
                    alternative-text=""
                  ></c-newton-selector-icon>
                </button>
              </template>
              <template lwc:else>
                <label class={labelClass} for="resource-input"
                  ><abbr
                    lwc:if={required}
                    class="slds-required"
                    title="required"
                    >*</abbr
                  >{label}</label
                >
                <input
                  id="resource-input"
                  type="text"
                  class="slds-input value-input"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-haspopup="listbox"
                  aria-expanded={dropdownExpanded}
                  aria-controls={listboxId}
                  aria-activedescendant={activeOptionId}
                  aria-describedby={errorDescribedBy}
                  aria-invalid={ariaInvalid}
                  required={required}
                  value={inputValue}
                  placeholder={placeholderText}
                  autocomplete="off"
                  oninput={handleSearchField}
                  onkeydown={handleKeyDown}
                  onclick={handleOpenOptions}
                  onblur={handleInputBlur}
                />
              </template>
            </div>
          </div>

          <template lwc:if={isMenuOpen}>
            <div slot="dropdown" onmousedown={handleMenuMouseDown}>
              <div
                lwc:if={isDrilledIn}
                class="newton-selector-flow-cpe-resource-selector__back"
              >
                <button
                  type="button"
                  class="slds-button slds-button_icon newton-selector-flow-cpe-resource-selector__icon-button"
                  title={labels.back}
                  aria-label={labels.back}
                  onclick={handleBack}
                >
                  <c-newton-selector-icon
                    name="chevron-left"
                    size="x-small"
                    box="button"
                    alternative-text=""
                  ></c-newton-selector-icon>
                </button>
              </div>
              <ul
                id="resource-listbox"
                class="slds-listbox slds-listbox_vertical newton-selector-flow-cpe-resource-selector__listbox"
                role="listbox"
                aria-label={label}
              >
                <li
                  lwc:if={hasNoOptions}
                  role="presentation"
                  class="slds-p-around_small"
                >
                  {emptyMessage}
                </li>
                <template for:each={optionGroups} for:item="group">
                  <li
                    key={group.type}
                    role="group"
                    aria-labelledby={group.headingId}
                    class="slds-listbox__item newton-selector-flow-cpe-resource-selector__group"
                  >
                    <div
                      id={group.headingId}
                      class="newton-selector-flow-cpe-resource-selector__group-heading"
                    >
                      {group.type}
                    </div>
                    <template for:each={group.options} for:item="row">
                      <div
                        key={row.key}
                        id={row.optionId}
                        class={row.optionClass}
                        role="option"
                        aria-selected={row.ariaSelected}
                        data-value={row.value}
                        data-index={row.index}
                        onclick={handleOptionClick}
                      >
                        <span
                          class="slds-media__body newton-selector-flow-cpe-resource-selector__option-body"
                        >
                          <c-newton-selector-flow-cpe-lookup-choice-option
                            row={row}
                          ></c-newton-selector-flow-cpe-lookup-choice-option>
                          <span
                            lwc:if={row.isDrillable}
                            class="slds-assistive-text"
                            >{labels.drillHint}</span
                          >
                        </span>
                        <button
                          lwc:if={row.isObject}
                          data-index={row.index}
                          type="button"
                          tabindex="-1"
                          aria-hidden="true"
                          class="slds-button slds-button_icon newton-selector-flow-cpe-resource-selector__chevron"
                          title="Open object fields"
                          onclick={handleOpenObject}
                        >
                          <c-newton-selector-icon
                            name="chevron-right"
                            size="x-small"
                            box="button"
                            alternative-text=""
                          ></c-newton-selector-icon>
                        </button>

                        <button
                          lwc:if={row.storeOutputAutomatically}
                          data-index={row.index}
                          type="button"
                          tabindex="-1"
                          aria-hidden="true"
                          class="slds-button slds-button_icon newton-selector-flow-cpe-resource-selector__chevron"
                          title="Open screen component outputs"
                          onclick={handleOpenScreenComponent}
                        >
                          <c-newton-selector-icon
                            name="chevron-right"
                            size="x-small"
                            box="button"
                            alternative-text=""
                          ></c-newton-selector-icon>
                        </button>

                        <button
                          lwc:if={row.globalVariable}
                          data-index={row.index}
                          type="button"
                          tabindex="-1"
                          aria-hidden="true"
                          class="slds-button slds-button_icon newton-selector-flow-cpe-resource-selector__chevron"
                          title="Open global variable"
                          onclick={handleOpenGlobalVariable}
                        >
                          <c-newton-selector-icon
                            name="chevron-right"
                            size="x-small"
                            box="button"
                            alternative-text=""
                          ></c-newton-selector-icon>
                        </button>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </c-newton-selector-combobox>
      </div>
      <div
        lwc:if={errorText}
        id="resource-help"
        class="slds-form-element__help"
      >
        {errorText}
      </div>
    </div>
  </div>
</template>
