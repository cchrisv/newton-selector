<template>
  <div class="newton-group-wrapper">
    <template lwc:if={showOuterSearch}>
      <div class="newton-search-bar">
        <c-newton-selector-icon
          name="search"
          size="x-small"
          box="input"
        ></c-newton-selector-icon>
        <input
          type="search"
          class="newton-search-bar__input"
          placeholder={labels.search}
          value={_searchTerm}
          oninput={handleSearch}
          aria-label={labels.filterItems}
        />
      </div>
    </template>

    <template lwc:if={showToolbar}>
      <div class="newton-toolbar">
        <button
          type="button"
          class="slds-button slds-button_neutral newton-toolbar__btn"
          onclick={handleSelectAll}
        >
          {labels.selectAll}
        </button>
        <button
          type="button"
          class="slds-button slds-button_neutral newton-toolbar__btn"
          onclick={handleClearAll}
        >
          {labels.clearAll}
        </button>
      </div>
    </template>

    <template lwc:if={isBasicCardLayout}>
      <div
        class={groupClass}
        style={groupStyle}
        oncardselect={handleCardSelect}
        oncardrepick={handleCardRepick}
      >
        <template for:each={cards} for:item="item">
          <c-newton-selector-choice-tile
            key={item.id}
            item={item}
            selected={item._selected}
            disabled={item._disabled}
            lwc:spread={tileProps}
          ></c-newton-selector-choice-tile>
        </template>
        <template lwc:if={isEmpty}>
          <div class="newton-empty">
            <c-newton-selector-icon
              name="search"
              size="x-small"
              box="tile"
            ></c-newton-selector-icon>
            <p>{labels.noItems}</p>
          </div>
        </template>
      </div>
    </template>

    <template lwc:if={isPicklist}>
      <div
        class="newton-picklist"
        style={groupStyle}
        onfocusout={handlePicklistFocusOut}
      >
        <div class="slds-combobox_container newton-picklist__combobox">
          <div class={picklistComboboxClass}>
            <div class={picklistInputContainerClass} role="none">
              <template lwc:if={selectedPicklistIcon}>
                <span
                  class="slds-icon_container slds-combobox__input-entity-icon newton-picklist__selected-icon"
                  aria-hidden="true"
                >
                  <c-newton-selector-icon
                    name={selectedPicklistIcon}
                    size="x-small"
                    box="input"
                  ></c-newton-selector-icon>
                </span>
              </template>

              <button
                lwc:ref="trigger"
                class={picklistInputClass}
                type="button"
                role="combobox"
                aria-haspopup="listbox"
                aria-controls={picklistControls}
                aria-expanded={picklistExpanded}
                aria-activedescendant={picklistActiveDescendant}
                aria-label={picklistAriaLabel}
                title={picklistInputTitle}
                onkeydown={handlePicklistKeydown}
                onclick={handlePicklistToggle}
              >
                <span class="slds-truncate">{picklistButtonLabel}</span>
              </button>

              <span
                class="slds-icon_container slds-input__icon slds-input__icon_right newton-picklist__chevron"
                aria-hidden="true"
              >
                <c-newton-selector-icon
                  name={picklistChevron}
                  size="x-small"
                  box="input"
                ></c-newton-selector-icon>
              </span>
            </div>

            <template lwc:if={_picklistOpen}>
              <div
                class="slds-dropdown slds-dropdown_fluid newton-picklist__menu"
              >
                <template lwc:if={enableSearch}>
                  <div class="slds-form-element newton-picklist__search">
                    <div
                      class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left"
                    >
                      <span
                        class="slds-icon_container slds-input__icon slds-input__icon_left"
                        aria-hidden="true"
                      >
                        <c-newton-selector-icon
                          name="search"
                          size="x-small"
                          box="input"
                        ></c-newton-selector-icon>
                      </span>
                      <input
                        type="search"
                        class="slds-input"
                        placeholder={labels.searchOptions}
                        value={_searchTerm}
                        oninput={handleSearch}
                        onkeydown={handlePicklistKeydown}
                        aria-label={labels.filterPicklistOptions}
                        aria-controls={picklistListboxId}
                        aria-activedescendant={picklistActiveDescendant}
                      />
                    </div>
                  </div>
                </template>
                <template lwc:if={hasFilteredItems}>
                  <ul
                    id={picklistListboxId}
                    class="slds-listbox slds-listbox_vertical newton-picklist__listbox"
                    role="listbox"
                    aria-label={picklistAriaLabel}
                    aria-multiselectable={picklistAriaMultiselectable}
                    onmousedown={handlePicklistOptionMouseDown}
                  >
                    <template for:each={picklistItems} for:item="item">
                      <li
                        key={item.id}
                        class="slds-listbox__item"
                        role="presentation"
                      >
                        <div
                          id={item._optionId}
                          class={item._optionClass}
                          role="option"
                          aria-selected={item._ariaSelected}
                          aria-disabled={item._ariaDisabled}
                          data-value={item.value}
                          onclick={handlePicklistOptionSelect}
                        >
                          <c-newton-selector-choice-tile
                            item={item}
                            selected={item._selected}
                            disabled={item._disabled}
                            presentational
                            lwc:spread={tileProps}
                          ></c-newton-selector-choice-tile>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <template lwc:else>
                  <p class="newton-picklist__empty">
                    {labels.noOptionsToDisplay}
                  </p>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <template lwc:if={isRadio}>
      <div
        class={groupClass}
        style={groupStyle}
        oncardselect={handleCardSelect}
        oncardrepick={handleCardRepick}
      >
        <template for:each={radioItems} for:item="item">
          <div key={item.id} class={item._radioClass}>
            <span class="newton-radio-card__marker" aria-hidden="true"></span>
            <c-newton-selector-choice-tile
              item={item}
              selected={item._selected}
              disabled={item._disabled}
              lwc:spread={tileProps}
            ></c-newton-selector-choice-tile>
          </div>
        </template>
        <template lwc:if={isEmpty}>
          <div class="newton-empty">
            <c-newton-selector-icon
              name="search"
              size="x-small"
              box="tile"
            ></c-newton-selector-icon>
            <p>{labels.noItems}</p>
          </div>
        </template>
      </div>
    </template>

    <template lwc:if={isTransferLayout}>
      <div class={transferClass} style={groupStyle}>
        <section
          class={availablePanelClass}
          data-zone="available"
          aria-label={availablePanelAriaLabel}
          ondragover={handleDragOver}
          ondragleave={handleDragLeave}
          ondrop={handleDrop}
        >
          <header class="newton-transfer__head">
            <span id={availableLabelId} class="newton-transfer__label"
              >{availablePanelLabel}</span
            >
            <span class="newton-transfer__count">{availableCountLabel}</span>
          </header>
          <template lwc:if={enableSearch}>
            <div class="newton-transfer__search">
              <c-newton-selector-icon
                name="search"
                size="x-small"
                box="input"
              ></c-newton-selector-icon>
              <input
                type="search"
                class="newton-search-bar__input"
                placeholder={labels.filterAvailable}
                value={_searchTerm}
                oninput={handleSearch}
                aria-label={labels.filterAvailableOptions}
              />
            </div>
          </template>
          <template lwc:if={isDualListbox}>
            <div class="newton-transfer__list">
              <ul
                class="slds-listbox slds-listbox_vertical newton-transfer__options"
                role="listbox"
                aria-label={labels.availableOptions}
                aria-multiselectable={dualMultiselectable}
                data-zone="available"
                onkeydown={handleDualKeydown}
              >
                <template for:each={transferAvailableItems} for:item="item">
                  <li
                    key={item.id}
                    class="slds-listbox__item"
                    role="presentation"
                  >
                    <div
                      class="newton-transfer__option"
                      role="option"
                      tabindex={item._tabindex}
                      aria-selected={item._ariaSelected}
                      aria-disabled={item._ariaDisabled}
                      data-zone="available"
                      data-value={item.value}
                      onclick={handleDualOptionClick}
                    >
                      <c-newton-selector-choice-tile
                        item={item}
                        selected={item._selected}
                        disabled={item._disabled}
                        presentational
                        lwc:spread={tileProps}
                      ></c-newton-selector-choice-tile>
                    </div>
                  </li>
                </template>
              </ul>
              <template lwc:if={isAvailableEmpty}>
                <p class="newton-transfer__empty">{availableEmptyMessage}</p>
              </template>
            </div>
          </template>
          <template lwc:else>
            <div
              class="newton-transfer__list"
              role="group"
              aria-labelledby={availableLabelId}
              oncardselect={handleAvailableCardSelect}
            >
              <template lwc:if={hasAvailableItems}>
                <template for:each={transferAvailableItems} for:item="item">
                  <div
                    key={item.id}
                    class="newton-transfer__item newton-transfer__item_draggable"
                    data-value={item.value}
                    draggable={item._draggable}
                    ondragstart={handleDragStart}
                  >
                    <c-newton-selector-choice-tile
                      item={item}
                      selected={item._selected}
                      disabled={item._disabled}
                      lwc:spread={tileProps}
                    ></c-newton-selector-choice-tile>
                  </div>
                </template>
              </template>
              <template lwc:else>
                <p class="newton-transfer__empty">{availableEmptyMessage}</p>
              </template>
            </div>
          </template>
        </section>

        <template lwc:if={isDualListbox}>
          <div class="slds-assistive-text" aria-live="polite">
            {_dualAnnouncement}
          </div>
          <div
            class="newton-transfer__controls"
            role="group"
            aria-label={labels.moveOptions}
          >
            <button
              type="button"
              class="slds-button slds-button_icon slds-button_icon-border newton-transfer__control"
              title={labels.moveSelectedToChosen}
              disabled={dualAddDisabled}
              onclick={handleDualAdd}
            >
              <c-newton-selector-icon
                name="chevron-right"
                size="x-small"
                box="button"
              ></c-newton-selector-icon>
              <span class="slds-assistive-text"
                >{labels.moveSelectedToChosen}</span
              >
            </button>
            <button
              type="button"
              class="slds-button slds-button_icon slds-button_icon-border newton-transfer__control"
              title={labels.moveAllToChosen}
              disabled={dualAddAllDisabled}
              onclick={handleDualAddAll}
            >
              <c-newton-selector-icon
                name="chevrons-right"
                size="x-small"
                box="button"
              ></c-newton-selector-icon>
              <span class="slds-assistive-text">{labels.moveAllToChosen}</span>
            </button>
            <button
              type="button"
              class="slds-button slds-button_icon slds-button_icon-border newton-transfer__control"
              title={labels.removeSelected}
              disabled={dualRemoveDisabled}
              onclick={handleDualRemove}
            >
              <c-newton-selector-icon
                name="chevron-left"
                size="x-small"
                box="button"
              ></c-newton-selector-icon>
              <span class="slds-assistive-text">{labels.removeSelected}</span>
            </button>
            <button
              type="button"
              class="slds-button slds-button_icon slds-button_icon-border newton-transfer__control"
              title={labels.removeAll}
              disabled={dualRemoveAllDisabled}
              onclick={handleDualRemoveAll}
            >
              <c-newton-selector-icon
                name="chevrons-left"
                size="x-small"
                box="button"
              ></c-newton-selector-icon>
              <span class="slds-assistive-text">{labels.removeAll}</span>
            </button>
          </div>
        </template>

        <section
          class={selectedPanelClass}
          data-zone="selected"
          aria-label={selectedPanelAriaLabel}
          ondragover={handleDragOver}
          ondragleave={handleDragLeave}
          ondrop={handleDrop}
        >
          <header class="newton-transfer__head">
            <span id={selectedLabelId} class="newton-transfer__label"
              >{selectedPanelLabel}</span
            >
            <span class="newton-transfer__count">{selectedCountLabel}</span>
          </header>
          <template lwc:if={isDualListbox}>
            <div class="newton-transfer__list">
              <ul
                class="slds-listbox slds-listbox_vertical newton-transfer__options"
                role="listbox"
                aria-label={labels.chosenOptions}
                aria-multiselectable={dualMultiselectable}
                data-zone="selected"
                onkeydown={handleDualKeydown}
              >
                <template for:each={transferSelectedItems} for:item="item">
                  <li
                    key={item.id}
                    class="slds-listbox__item"
                    role="presentation"
                  >
                    <div
                      class="newton-transfer__option"
                      role="option"
                      tabindex={item._tabindex}
                      aria-selected={item._ariaSelected}
                      aria-disabled={item._ariaDisabled}
                      data-zone="selected"
                      data-value={item.value}
                      onclick={handleDualOptionClick}
                    >
                      <c-newton-selector-choice-tile
                        item={item}
                        selected={item._selected}
                        disabled={item._disabled}
                        presentational
                        lwc:spread={tileProps}
                      ></c-newton-selector-choice-tile>
                    </div>
                  </li>
                </template>
              </ul>
              <template lwc:if={isSelectedEmpty}>
                <p class="newton-transfer__empty">{selectedEmptyMessage}</p>
              </template>
            </div>
          </template>
          <template lwc:else>
            <div
              class="newton-transfer__list"
              role="group"
              aria-labelledby={selectedLabelId}
              oncardselect={handleSelectedCardSelect}
            >
              <template lwc:if={hasSelectedItems}>
                <template for:each={transferSelectedItems} for:item="item">
                  <div
                    key={item.id}
                    class="newton-transfer__item newton-transfer__item_draggable"
                    data-value={item.value}
                    draggable={item._draggable}
                    ondragstart={handleDragStart}
                  >
                    <c-newton-selector-choice-tile
                      item={item}
                      selected={item._selected}
                      disabled={item._disabled}
                      lwc:spread={tileProps}
                    ></c-newton-selector-choice-tile>
                  </div>
                </template>
              </template>
              <template lwc:else>
                <p class="newton-transfer__empty">{selectedEmptyMessage}</p>
              </template>
            </div>
          </template>
        </section>
      </div>
    </template>

    <template lwc:if={showManualInput}>
      <div class="slds-form-element newton-manual-input">
        <label class="slds-form-element__label" for="manual-input">
          {manualInputLabel}
        </label>
        <div class="slds-form-element__control">
          <input
            id="manual-input"
            type="text"
            class="slds-input newton-manual-input__control"
            value={manualInputValue}
            minlength={manualInputMinLength}
            maxlength={manualInputMaxLength}
            aria-describedby={manualInputDescribedBy}
            oninput={handleManualInput}
          />
        </div>
        <template lwc:if={manualInputHelpText}>
          <div id="manual-input-help" class="slds-form-element__help">
            {manualInputHelpText}
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
