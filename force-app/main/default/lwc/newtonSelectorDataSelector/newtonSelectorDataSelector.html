<template>
  <!-- SLDS 2 form-element pattern. The label uses the standard field label
         class only so the selector aligns with lightning-input labels. -->
  <fieldset
    class="slds-form-element newton-data-selector"
    aria-describedby={describedBy}
  >
    <template lwc:if={hasLabel}>
      <legend class="slds-form-element__label newton-data-selector__label">
        <template lwc:if={required}>
          <abbr title={labels.required} class="slds-required">*</abbr>
        </template>
        <span class="newton-data-selector__label-text">{label}</span>
        <template lwc:if={hasFieldHelp}>
          <lightning-helptext
            class="newton-data-selector__field-help"
            content={fieldLevelHelp}
          ></lightning-helptext>
        </template>
      </legend>
      <template lwc:if={hasHelp}>
        <div
          id="selector-help"
          class="slds-form-element__help newton-data-selector__help"
          role="note"
        >
          {helpText}
        </div>
      </template>
    </template>

    <div class="slds-form-element__control newton-data-selector__control">
      <template lwc:if={isLoading}>
        <div
          class="newton-state newton-state_loading"
          role="status"
          aria-live="polite"
        >
          <div class="newton-skeleton newton-skeleton_card"></div>
          <div class="newton-skeleton newton-skeleton_card"></div>
          <div class="newton-skeleton newton-skeleton_card"></div>
          <span class="slds-assistive-text">{labels.loadingOptions}</span>
        </div>
      </template>

      <template lwc:if={hasError}>
        <div class="newton-state newton-state_error" role="alert">
          <div class="newton-state__plate" aria-hidden="true">
            <span
              class="newton-state__plate-corner newton-state__plate-corner_tl"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_tr"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_bl"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_br"
            ></span>
            <span class="newton-state__glyph newton-state__glyph_error">
              <c-newton-selector-icon
                name="circle-alert"
                size="small"
                alternative-text=""
              ></c-newton-selector-icon>
            </span>
          </div>
          <p class="newton-state__message">{resolvedErrorMessage}</p>
          <template lwc:if={canRetry}>
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleRetry}
            >
              <c-newton-selector-icon
                class="slds-button__icon_left"
                name="rotate-cw"
                size="xx-small"
                alternative-text=""
              ></c-newton-selector-icon>
              {labels.tryAgain}
            </button>
          </template>
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <div class="newton-state newton-state_empty">
          <div class="newton-state__plate" aria-hidden="true">
            <span
              class="newton-state__plate-corner newton-state__plate-corner_tl"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_tr"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_bl"
            ></span>
            <span
              class="newton-state__plate-corner newton-state__plate-corner_br"
            ></span>
            <span class="newton-state__glyph">
              <c-newton-selector-icon
                name="search"
                size="small"
                alternative-text=""
              ></c-newton-selector-icon>
            </span>
          </div>
          <p class="newton-state__message">{emptyStateMessage}</p>
        </div>
      </template>

      <template lwc:if={isPopulated}>
        <c-newton-selector-group
          items={_items}
          variant={layout}
          selection-mode={selectionMode}
          selected-values={selectedValuesForGroup}
          none-selected={noneOptionIsSelected}
          max-selections={maxSelections}
          show-select-all={showSelectAll}
          enable-search={enableSearch}
          preview-mode={previewMode}
          field-label={label}
          manual-input-label={manualInputLabel}
          manual-input-value={manualValueForGroup}
          manual-input-min-length={manualInputMinLength}
          manual-input-max-length={manualInputMaxLength}
          onselectionchange={handleSelectionChange}
          lwc:spread={appearance}
        ></c-newton-selector-group>
      </template>
    </div>
    <template lwc:if={hasValidationMessage}>
      <div
        id="selector-error"
        class="slds-form-element__help slds-text-color_error"
        role="alert"
      >
        {validationMessage}
      </div>
    </template>
  </fieldset>
</template>
