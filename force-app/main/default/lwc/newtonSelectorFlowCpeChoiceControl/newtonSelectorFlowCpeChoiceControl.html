<template>
  <div class="slds-form-element newton-studio-choice">
    <template lwc:if={label}>
      <span class={fieldLabelClass}>{label}</span>
      <template lwc:if={showFieldLevelHelp}>
        <lightning-helptext
          class="slds-form-element__icon"
          content={fieldLevelHelp}
        ></lightning-helptext>
      </template>
    </template>
    <div class="slds-form-element__control newton-studio-choice__control">
      <c-newton-selector-combobox
        mode="select"
        variant="label-hidden"
        label={label}
        disabled={disabled}
        options={items}
        value={value}
        enable-search={enableSearch}
        placeholder-when-empty="Choose an option"
        placeholder="Search options"
        scroll-after-n-items="7"
        onselectionchange={handleSelectionChange}
      ></c-newton-selector-combobox>
    </div>
  </div>
</template>
