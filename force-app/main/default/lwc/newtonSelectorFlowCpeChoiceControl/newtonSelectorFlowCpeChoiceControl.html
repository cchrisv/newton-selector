<template>
  <div class="slds-form-element newton-studio-choice">
    <template lwc:if={showVisibleLabel}>
      <span class="slds-form-element__label slds-no-flex" aria-hidden="true"
        >{label}</span
      >
      <template lwc:if={fieldLevelHelp}>
        <lightning-helptext
          class="slds-form-element__icon"
          content={fieldLevelHelp}
        ></lightning-helptext>
      </template>
    </template>
    <div class="slds-form-element__control newton-studio-choice__control">
      <c-newton-selector-combobox
        mode="select"
        variant="label-hidden"
        label={label}
        options={items}
        value={value}
        enable-search={enableSearch}
        placeholder="Search options"
        onselectionchange={handleSelectionChange}
      ></c-newton-selector-combobox>
    </div>
  </div>
</template>
